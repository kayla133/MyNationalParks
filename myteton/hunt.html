<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Spotting</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <style>
        #map-container {
            position: relative;
            width: 75%;
            margin: 0 auto;
        }

        #park-map {
            width: 100%;
            cursor: crosshair;
        }

        .animal-icon {
            position: absolute;
            width: 32px;
            height: 32px;
            transform: translate(-50%, -50%);
        }

        .hidden {
            display: none;
        }

        #entry-form {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            padding: 20px;
            width: 300px;
            z-index: 10;
        }

        /* 🧭 Form fade animation */
        #entry-form {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #entry-form.visible {
            opacity: 1;
            visibility: visible;
        }

        /* 📍 Universal pin styling */
        .map-pin {
            position: absolute;
            width: 24px;
            height: 24px;
            transform: translate(-50%, -100%);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .map-pin:hover {
            transform: translate(-50%, -110%) scale(1.1);
        }

        /* 🧭 Form fade animation */
        #entry-form {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #entry-form.visible {
            opacity: 1;
            visibility: visible;
        }

        /* 📍 Pin styling */
        .map-pin {
            position: absolute;
            width: 24px;
            height: 24px;
            transform: translate(-50%, -100%);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .map-pin:hover {
            transform: translate(-50%, -110%) scale(1.1);
        }

        /* 💬 Tooltip styling */
        .tooltip {
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            color: #222;
            white-space: nowrap;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            z-index: 10;
        }

        .tooltip.visible {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-4px);
        }

        #clear-entries {
            background-color: #3e5e3c;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .sighting-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            text-align: left;
            font-family: sans-serif;
        }

        .sighting-popup button {
            margin-top: 10px;
            background-color: #555;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .sighting-popup button:hover {
            background-color: #333;
        }
    </style>
</head>

<body>
    <header>
        <img class="logo" src="img/flogo.PNG" alt="image of logo">
    </header>
    <nav>
        <ul>
            <li>
                <a href="alaska.html">Alaska</a>
            </li>
            <li>
                <a href="cali.html">California</a>
            </li>
            <li>
                <a href="utah.html">Utah</a>
            </li>
            <li>
                <a href="wyom.html">Wyoming</a>
            </li>
        </ul>
    </nav>

    <h2>Animal Hunt</h2>

    <div class="button-container">
        <button id="clear-entries">Clear Entries</button>
    </div>


    <div id="map-container">
        <img id="park-map" src="maps/teton.jpg" alt="National Park Map">
    </div>
    <div id="entry-form" class="hidden">
        <label for="category">Choose Category:</label>
        <select id="category">
            <option value="">-- Select Category --</option>
            <option value="mammals">Mammals</option>
            <option value="birds">Birds</option>
            <option value="reptiles">Reptiles</option>
            <option value="fish">Fish</option>
        </select>

        <label for="animal">Choose Animal:</label>
        <select id="animal">
            <option value="">-- Select Animal --</option>
        </select>

        <label>Upload a photo:</label>
        <input type="file" id="photo-input">

        <label>Notes:</label>
        <textarea id="notes" placeholder="Write about your sighting..."></textarea>

        <button id="save-entry">Save</button>
    </div>


    <script src="script.js"></script>
</body>

</html>
