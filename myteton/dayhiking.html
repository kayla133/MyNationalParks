<!DOCTYPE html>

  <title>MyNationalParks</title>

  <style>
    main {
      background-color: #adab91;
      padding: 5%;
      margin: 3%;
      border-radius: 15px;
    }

    .dayhikeTop {
      padding: 2%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr;
      gap: 1rem;
      place-items: center;
      max-width: 900px;
      margin: 0 auto;
    }

    .bottom {
      padding: 2%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      grid-template-rows: 1fr;
      gap: 1rem;
      place-items: center;
      max-width: 900px;
      margin: 0 auto;
    }

    .dayhike p {
      text-decoration: none;
      color: #3e5e3c;
      font-size: 20px;
      text-align: center;
    }

     a {
      text-decoration: none;
      color: #3e5e3c;
      display: block;
      padding: 1rem 0;
      font-size: 20px;
    }

    .death,
    .jenny,
    .insp,
    .rock,
    .granite {
      width: 300px;
      height: 200px;
      background-color: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .link a {
      background-color: #575b67;
      color: white;
      width: 300px;
      height: 50px;
      display: block;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      border-radius: 15px;
    }

    h2 {
      background-color: #575b67;
      color: white;
      width: 500px;
      height: 50px;
      display: block;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
