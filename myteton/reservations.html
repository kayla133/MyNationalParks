<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation Grid</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html {
            background-color: #C8D6AF;
        }

        body {
            margin: 0;
            padding: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 700px;
            margin: auto;
            padding: 5%;
            gap: 1.5rem;
            place-items: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .box {
            width: 300px;
            height: 200px;
            background-color: white;
            color: #3e5e3c;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .box:hover {
            background-color: #f0f0f0;
        }


        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            margin: 120px auto;
            position: relative;
        }

        .close {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 24px;
            cursor: pointer;
        }

        #reservationForm input {
            width: 100%;
            padding: 6px;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
        }

        button:hover {
            background: #555;
        }
    </style>
</head>

<body>
    <header>
        <img class="logo" src="img/flogo.PNG" alt="image of logo">
    </header>
    <nav class="navbar">
        <button class="menu-toggle" aria-label="Open navigation menu">
            ☰
        </button>
        <ul class="nav-links">
            <li>
                <a href="teton.html">MyTetons</a>
            </li>
            <li>
                <a href="map.html">Park Map</a>
            </li>
            <li>
                <a href="hiking.html">Hiking Trails</a>
            </li>
            <li>
                <a href="hunt.html">Scavenger Hunt</a>
            </li>
            <li>
                <a href="blog.html">Park Blogs</a>
            </li>
            <li>
                <a href="memories.html">Memories</a>
            </li>
        </ul>
    </nav>

    <h2>Reservation Grid</h2>

    <div class="grid" id="reservationGrid">
        <div class="box" data-index="0">Enter Reservation Info</div>
        <div class="box" data-index="1">Enter Reservation Info</div>
        <div class="box" data-index="2">Enter Reservation Info</div>
        <div class="box" data-index="3">Enter Reservation Info</div>
        <div class="box" data-index="4">Enter Reservation Info</div>
        <div class="box" data-index="5">Enter Reservation Info</div>
    </div>


    <div id="reservationModal" class="modal">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>

            <form id="reservationForm">
                <label>Location:</label>
                <input type="text" id="name" required>

                <label>Start Date:</label>
                <input type="date" id="startDate" required>

                <label>End Date:</label>
                <input type="date" id="endDate" required>

                <button type="submit">Save</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 MyNationalParks</p>
    </footer>

    <script src="res.js"></script>
</body>

</html>
